<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnyFlow - See your energy. Move with confidence.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="landing-container">
        <!-- Logo -->
        <img src="logo.png" alt="EnyFlow Logo" class="logo">
        
        <!--Content -->
        <main class="main-content">
            <div class="content-wrapper">
                <!-- Links Tekst Content -->
                <div class="text-content">
                    <h1 class="headline">See your energy.<br>Move with confidence.</h1>
                    <p class="description">Ontdek je energiebalans en beweeg met vertrouwen. EnyFlow helpt je om je dagelijkse energiepatronen te begrijpen en je optimale momenten te vinden.</p>
                    
                    <!-- Download Buttons -->
                    <div class="download-buttons">
                        <a href="#" class="download-btn app-store" aria-label="Download op App Store">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                            </svg>
                            <div class="btn-text">
                                <span class="btn-label">Download on the</span>
                                <span class="btn-name">App Store</span>
                            </div>
                        </a>
                        <a href="#" class="download-btn google-play" aria-label="Download op Google Play">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/>
                            </svg>
                            <div class="btn-text">
                                <span class="btn-label">GET IT ON</span>
                                <span class="btn-name">Google Play</span>
                            </div>
                        </a>
                    </div>
                </div>

                <!-- Rechts: App Mockup -->
                <div class="mockup-container">
                    <div class="phone-mockup">
                        <div class="phone-screen">
                            <img src="mockup.png" alt="EnyFlow App Screenshot" class="app-screenshot">
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Achtergrond -->
        <div class="background">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>
    </div>

    <script>
        // Wacht tot de pagina volledig geladen is
        window.addEventListener('load', () => {
            // Zet initiële states voor animatie
            gsap.set('.download-btn', { opacity: 0, y: 30 });
            
            // Timeline voor alle animaties
            const tl = gsap.timeline();

            // Logo animatie - fade in van boven
            tl.from('.logo', {
                y: -50,
                opacity: 0,
                duration: 1,
                ease: 'power3.out'
            });

            // Headline animatie - slide in van links met fade
            tl.from('.headline', {
                x: -100,
                opacity: 0,
                duration: 1.2,
                ease: 'power3.out'
            }, '-=0.5');

            // Description animatie - fade in
            tl.from('.description', {
                opacity: 0,
                y: 30,
                duration: 1,
                ease: 'power2.out'
            }, '-=0.8');

            // Download buttons - stagger animatie
            tl.to('.download-btn', {
                opacity: 1,
                y: 0,
                duration: 0.8,
                stagger: 0.2,
                ease: 'back.out(1.7)'
            }, '-=0.6');

            // Phone mockup - slide in van rechts met scale
            tl.from('.phone-mockup', {
                x: 150,
                opacity: 0,
                scale: 0.8,
                duration: 1.2,
                ease: 'power3.out'
            }, '-=1');

            // Achtergrond cirkels - floating animaties (oneindig)
            gsap.to('.circle-1', {
                y: '+=30',
                x: '+=20',
                duration: 4,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut'
            });

            gsap.to('.circle-2', {
                y: '-=40',
                x: '-=15',
                duration: 5,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                delay: 0.5
            });

            gsap.to('.circle-3', {
                y: '+=25',
                x: '+=30',
                duration: 4.5,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                delay: 1
            });

            // Pulsing effect op de achtergrond cirkels
            gsap.to('.circle', {
                scale: 1.1,
                opacity: 0.7,
                duration: 3,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                stagger: 0.5
            });

            // Hover animatie voor download buttons
            document.querySelectorAll('.download-btn').forEach(btn => {
                btn.addEventListener('mouseenter', () => {
                    gsap.to(btn, {
                        scale: 1.05,
                        duration: 0.3,
                        ease: 'power2.out'
                    });
                });

                btn.addEventListener('mouseleave', () => {
                    gsap.to(btn, {
                        scale: 1,
                        duration: 0.3,
                        ease: 'power2.out'
                    });
                });
            });

            // Subtle floating animatie voor de phone mockup
            gsap.to('.phone-mockup', {
                y: '+=15',
                duration: 3,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut',
                delay: 2
            });
        });
    </script>
</body>
</html>
